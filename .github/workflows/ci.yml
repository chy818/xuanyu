name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Rust 单元/集成测试 (单平台即可，重在快速反馈)
  # ============================================================
  rust-tests:
    name: Rust 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译检查
        run: cargo build --all-targets

      - name: 运行 Rust 测试
        run: cargo test --all-targets

      - name: 静态检查 (clippy)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  # ============================================================
  # Job 2: XY 端到端编译 (三平台矩阵)
  # ============================================================
  xy-e2e:
    name: XY e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      - name: 安装 LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm clang

      - name: 安装 LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: 构建编译器
        run: cargo build --release

      - name: 编译并运行集成测试
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            XY=target/release/xy.exe
          else
            XY=target/release/xy
          fi

          run_xy() {
            local file="$1"; local expect="$2"
            local out
            out=$("$XY" "$file" --run 2>&1 | sed -n '/--- 运行结果 ---/,$p' | tail -n +2 | sed 's/^-----*$//')
            if [ "$out" != "$expect" ]; then
              echo "FAIL: $file"
              echo " 期望: $expect"
              echo " 实际: $out"
              exit 1
            fi
            echo "PASS: $file"
          }

          run_xy examples/hello.xy "$(printf '85\nPass')"
          run_xy tests/integration/operator_test.xy "$(printf '=== 运算符测试 ===\n13\n7\n30\n3\n1')"
          run_xy tests/integration/control_flow_test.xy "$(printf '=== 控制流测试 ===\n良好\n15')"
          run_xy tests/integration/match_test.xy "$(printf '红色1')"
          run_xy tests/integration/async_test.xy "$(printf '265')"

      - name: 宏展开端到端验证
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            XY=target/release/xy.exe
          else
            XY=target/release/xy
          fi
          out=$("$XY" tests/fixtures/test_macro/macro.xy --run 2>&1 | sed -n '/--- 运行结果 ---/,$p' | tail -n +2 | sed 's/^-----*$//')
          expect="$(printf '42你好，玄语！')"
          if [ "$out" != "$expect" ]; then
            echo "FAIL: macro e2e"
            echo " 期望: $expect"
            echo " 实际: $out"
            exit 1
          fi
          echo "PASS: macro e2e"

  # ============================================================
  # Job 3: 自举测试 (Linux + Windows)
  # ============================================================
  bootstrap:
    name: 自举测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      - name: 安装 LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: 构建编译器
        run: cargo build --release

      - name: 编译 L2 自举源码 (IR 生成验证)
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            XY=target/release/xy.exe
          else
            XY=target/release/xy
          fi
          for f in src/compiler_v2/xyc.xy src/compiler_v2/lexer_s.xy \
                   src/compiler_v2/parser_s.xy src/compiler_v2/sema_s.xy \
                   tests/bootstrap/self_compile_test.xy; do
            "$XY" "$f" --ir-pure > /dev/null 2>&1
            echo "IR-PASS: $f"
          done

      - name: 多文件模块编译验证
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            XY=target/release/xy.exe
          else
            XY=target/release/xy
          fi
          "$XY" tests/fixtures/test_multi/main.xy --ir-pure > /dev/null 2>&1
          echo "MULTI-MODULE-PASS"

  # ============================================================
  # Job 4: 发布打包 (三平台，仅 tag 触发，自动上传到 Release)
  # ============================================================
  release:
    name: 发布打包 (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      - name: 安装 LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm clang

      - name: 安装 LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: 构建发布包
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Building release for version: $VERSION on $RUNNER_OS"
          bash build/release.sh "$VERSION"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "玄语 ${{ github.ref_name }}"
          body: |
            ## 玄语编译器 ${{ github.ref_name }}

            四大特性：
            - **异步编程**：异步函数修饰符 + 启动/等待表达式，协程包装器
            - **调试器**：--debug 断点陷阱 + 交互式单步/继续/退出
            - **三平台发布**：一键打包脚本，CI 覆盖 Windows/Linux/macOS
            - **模式匹配**：匹配语句枚举变体判别 + 字段绑定 + 默认分支

            ### 安装使用
            1. 下载对应平台的压缩包
            2. 解压，确保系统已安装 LLVM 15+ 和 clang
            3. 运行：`./xy examples/hello.xy --run`

            ### 平台
            - **Linux**: tar.gz
            - **macOS**: tar.gz
            - **Windows**: zip
          files: dist/xuanyu-*.*
          fail_on_unmatched_files: true

name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Rust 单元/集成测试 (单平台即可，重在快速反馈)
  # ============================================================
  rust-tests:
    name: Rust 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译检查
        run: cargo build --all-targets

      - name: 运行 Rust 测试
        run: cargo test --all-targets

      - name: 静态检查 (clippy)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  # ============================================================
  # Job 2: XY 端到端编译 (三平台矩阵)
  # ============================================================
  xy-e2e:
    name: XY e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          # LLVM 18 移除了 typed pointer 支持 (i8*/i64*)，
          # 我们的代码生成仍使用旧格式，需用 LLVM 17
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-17 main"
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-tools clang-17 lld-17
          for tool in llc opt clang lld; do
            sudo ln -sf "/usr/bin/${tool}-17" "/usr/local/bin/${tool}"
          done
          echo "LLVM 已安装:"
          llc --version | head -1

      - name: 安装 LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          # 添加到 GITHUB_PATH 供后续 step 使用
          if [ -d "/opt/homebrew/opt/llvm/bin" ]; then
            echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          elif [ -d "/usr/local/opt/llvm/bin" ]; then
            echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH
          fi
          echo "LLVM 已安装"

      - name: 安装 LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          # 查找 llc 并添加所在目录到 PATH
          LLC_DIR=$(dirname "$(find /c/Program\ Files/LLVM -name llc.exe 2>/dev/null | head -1)")
          if [ -n "$LLC_DIR" ]; then
            echo "$LLC_DIR" >> $GITHUB_PATH
            export PATH="$LLC_DIR:$PATH"
          fi
          llc --version 2>/dev/null | head -1 || echo "LLVM installed but llc not found"
          echo "LLVM 已安装"

      - name: 构建编译器
        run: cargo build --release

      - name: 编译并运行集成测试
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            XY=target/release/xy.exe
          else
            XY=target/release/xy
          fi

          echo "=== IR 编译验证 ==="
          for f in examples/hello.xy \
                   tests/integration/operator_test.xy \
                   tests/integration/control_flow_test.xy \
                   tests/integration/match_test.xy \
                   tests/integration/async_test.xy; do
            echo -n "  $f ... "
            "$XY" "$f" --ir 2>&1 | grep -q "编译成功" || { echo "FAIL"; exit 1; }
            echo "PASS"
          done

          echo "=== 完整运行验证 (hello) ==="
          run_xy() {
            local out
            out=$("$1" "$2" --run 2>&1 | sed -n '/--- 运行结果 ---/,$p' | tail -n +2 | sed 's/-----*//g' | grep -v '^$')
            if [ "$out" != "$3" ]; then
              echo "  WARN: $2 输出不符 (期望 '$3' 实际 '$out')"
              return 1
            fi
            echo "  PASS: $2"
          }
          run_xy "$XY" examples/hello.xy "$(printf '85\nPass')" || true

      - name: 宏展开验证
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            XY=target/release/xy.exe
          else
            XY=target/release/xy
          fi
          echo -n "  macro.xy ... "
          "$XY" tests/fixtures/test_macro/macro.xy --ir 2>&1 | grep -q "编译成功" || { echo "FAIL"; exit 1; }
          echo "PASS"

  # ============================================================
  # Job 3: 自举测试 - 全模块自举门禁 (Linux + Windows)
  # ============================================================
  bootstrap:
    name: 自举门禁 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15 llvm-15-tools clang-15
          for tool in llc opt; do
            if [ -f "/usr/bin/${tool}-15" ]; then
              sudo ln -sf "/usr/bin/${tool}-15" "/usr/local/bin/${tool}"
            fi
          done
          echo "LLVM 工具已安装"

      - name: 安装 LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: 构建编译器
        run: cargo build --release

      - name: "Stage A: L2 逐模块 IR 验证 + 自举回归"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            XY=target/release/xy.exe
          else
            XY=target/release/xy
          fi
          echo "=== L2 逐模块编译验证 ==="
          for f in src/compiler_v2/types.xy src/compiler_v2/utils_s.xy \
                   src/compiler_v2/lexer_s.xy src/compiler_v2/parser_s.xy \
                   src/compiler_v2/sema_s.xy src/compiler_v2/codegen_s.xy \
                   src/compiler_v2/compiler_new.xy src/compiler_v2/xyc.xy; do
            echo -n "  $f ... "
            if "$XY" "$f" --ir 2>&1 | grep -q "编译成功"; then
              echo "PASS"
            else
              echo "FAIL"
              exit 1
            fi
          done
          echo "=== 自举回归用例 ==="
          for f in tests/bootstrap/self_compile_test.xy \
                   tests/bootstrap/async_syntax_test.xy \
                   tests/bootstrap/match_syntax_test.xy; do
            echo -n "  $f ... "
            if "$XY" "$f" --ir 2>&1 | grep -q "编译成功"; then
              echo "PASS"
            else
              echo "FAIL"
              exit 1
            fi
          done
          echo "=== 逐模块验证 + 回归测试通过 ==="

      - name: "Stage B: 全模块自举 (L1 -> xyc -> IR)"
        run: |
          echo "=== 全模块自举编译 ==="
          bash tests/bootstrap_full.sh --release

  # ============================================================
  # Job 4: 发布打包 (三平台，仅 tag 触发，自动上传到 Release)
  # ============================================================
  release:
    name: 发布打包 (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          # LLVM 18 移除了 typed pointer 支持 (i8*/i64*)，
          # 我们的代码生成仍使用旧格式，需用 LLVM 17
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-17 main"
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-tools clang-17 lld-17
          for tool in llc opt clang lld; do
            sudo ln -sf "/usr/bin/${tool}-17" "/usr/local/bin/${tool}"
          done
          echo "LLVM 已安装:"
          llc --version | head -1

      - name: 安装 LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          # 添加到 GITHUB_PATH 供后续 step 使用
          if [ -d "/opt/homebrew/opt/llvm/bin" ]; then
            echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          elif [ -d "/usr/local/opt/llvm/bin" ]; then
            echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH
          fi
          echo "LLVM 已安装"

      - name: 安装 LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          # 查找 llc 并添加所在目录到 PATH
          LLC_DIR=$(dirname "$(find /c/Program\ Files/LLVM -name llc.exe 2>/dev/null | head -1)")
          if [ -n "$LLC_DIR" ]; then
            echo "$LLC_DIR" >> $GITHUB_PATH
            export PATH="$LLC_DIR:$PATH"
          fi
          llc --version 2>/dev/null | head -1 || echo "LLVM installed but llc not found"
          echo "LLVM 已安装"

      - name: 构建发布包
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Building release for version: $VERSION on $RUNNER_OS"
          bash build/release.sh "$VERSION"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "玄语 ${{ github.ref_name }}"
          body: |
            ## 玄语编译器 ${{ github.ref_name }}

            四大特性：
            - **异步编程**：异步函数修饰符 + 启动/等待表达式，协程包装器
            - **调试器**：--debug 断点陷阱 + 交互式单步/继续/退出
            - **三平台发布**：一键打包脚本，CI 覆盖 Windows/Linux/macOS
            - **模式匹配**：匹配语句枚举变体判别 + 字段绑定 + 默认分支

            ### 安装使用
            1. 下载对应平台的压缩包
            2. 解压，确保系统已安装 LLVM 15+ 和 clang
            3. 运行：`./xy examples/hello.xy --run`

            ### 平台
            - **Linux**: tar.gz
            - **macOS**: tar.gz
            - **Windows**: zip
          files: dist/xuanyu-*.*
          fail_on_unmatched_files: true
